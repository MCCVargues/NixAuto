name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast: evaluates every output (incl. the aarch64 NixOS config) and
  # builds the x86_64 shell so UI breakage is caught without an ARM runner.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - run: nix flake check --print-build-logs

  # Full aarch64 system closure, built natively on a GitHub ARM runner.
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - uses: cachix/cachix-action@v16
        if: vars.CACHIX_CACHE_NAME != ''
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only main is what devices pull; don't upload PR builds.
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      - run: nix build .#toplevel --print-build-logs
