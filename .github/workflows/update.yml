name: Update inputs

# Moves flake.lock forward and commits it ONLY if the full system builds.
# Devices follow flake.lock on main, so this workflow is the update gate.
# See docs/updates.md.
on:
  # App repos notify us after a push to their main branch (docs/apps.md).
  repository_dispatch:
    types: [app-updated]
  # Weekly OS refresh (nixpkgs, RPi kernel/firmware, all apps).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      input:
        description: Flake input to update (empty = all inputs)
        required: false

permissions:
  contents: write

concurrency:
  group: update-inputs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04-arm
    env:
      INPUT: ${{ github.event.client_payload.input || github.event.inputs.input || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - uses: cachix/cachix-action@v16
        if: vars.CACHIX_CACHE_NAME != ''
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        run: |
          if [ -z "$INPUT" ]; then
            nix flake update
          elif [[ "$INPUT" =~ ^[A-Za-z0-9_-]+$ ]]; then
            nix flake update "$INPUT"
          else
            echo "Invalid input name: $INPUT" >&2; exit 1
          fi

      - name: Build system (gate)
        run: nix build .#toplevel --print-build-logs

      - name: Commit flake.lock
        run: |
          if [ -z "$(git status --porcelain flake.lock)" ]; then
            echo "flake.lock unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake.lock: update ${INPUT:-all inputs}"
          git push
